<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neeraja | Portfolio</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

/* ================= RESET ================= */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, Helvetica, sans-serif;
    scroll-behavior:smooth;
    transition:0.4s;
}

/* ================= BODY ================= */
body{
    background:#0f0f14;
    color:#eaeaea;
    overflow-x:hidden;
}

/* ================= BACKGROUND EFFECT ================= */
body::before,
body::after{
    content:"";
    position:fixed;
    width:320px;
    height:320px;
    border-radius:50%;
    filter:blur(130px);
    z-index:-1;
    animation: float 10s ease-in-out infinite alternate;
}

body::before{
    top:-120px;
    left:-120px;
    background:linear-gradient(135deg,#00f2fe,#4facfe);
}
body::after{
    bottom:-120px;
    right:-120px;
    background:linear-gradient(135deg,#f7971e,#ffd200);
}

/* ================= HEADER ================= */
header{
    position:sticky;
    top:0;
    z-index:999;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 60px;
    background:rgba(20,20,30,0.8);
    backdrop-filter:blur(12px);
    box-shadow:0 8px 25px rgba(0,0,0,0.4);
}

/* LOGO */
.logo{
    font-size:22px;
    font-weight:800;
    letter-spacing:2px;
    background:linear-gradient(90deg,#21d4fd,#b721ff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

/* NAVBAR */
.navbar ul{
    list-style:none;
    display:flex;
    gap:45px;
}

.navbar ul li a{
    text-decoration:none;
    color:#eaeaea;
    font-weight:600;
    position:relative;
    padding-bottom:6px;
}

.navbar ul li a::after{
    content:"";
    position:absolute;
    left:0;
    bottom:0;
    width:0%;
    height:2px;
    background:linear-gradient(90deg,#21d4fd,#b721ff);
    transition:0.35s;
}

.navbar ul li a:hover::after{
    width:100%;

}
.navbar ul li a:hover,
.navbar a.active{
    color:#21d4fd;
}

/* ================= MAIN SECTION ================= */
section{
    max-width:1200px;
    margin:80px auto;
    padding:100px 60px;
    border-radius:22px;
    background:rgba(255,255,255,0.03);
    backdrop-filter:blur(10px);
    box-shadow:0 20px 40px rgba(0,0,0,0.3);
}

/* SECTION TITLE */
section h2{
    font-size:36px;
    text-align:center;
    margin-bottom:50px;
    background:linear-gradient(90deg,#21d4fd,#b721ff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

/* ================= HOME CONTENT ================= */
.main{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:120px;
}

/* TEXT */
.sub1 h2{
    font-size:22px;
    margin-bottom:6px;
}

.sub1 h1{
    font-size:44px;
    margin-bottom:20px;
    background:linear-gradient(90deg,#00f2fe,#4facfe,#f7971e);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

/* PARAGRAPH */
.sub1 p{
    max-width:520px;
    font-size:17px;
    line-height:1.8;
    margin-bottom:25px;
    background:linear-gradient(90deg,#b721ff,#21d4fd,#f7971e);
    background-size:300% 300%;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:gradientMove 7s ease infinite;
}

/* ICONS */
.icons{
    margin-bottom:25px;
}

.icons a{
    font-size:26px;
    margin-right:20px;
    color:#ccc;
}

.icons a:hover{
    transform:translateY(-6px) scale(1.2);
    color:#21d4fd;
    text-shadow:0 0 15px rgba(33,212,253,0.8);
}

/* BUTTONS */
.btns a{
    display:inline-block;
    padding:12px 36px;
    border-radius:30px;
    background:linear-gradient(90deg,#21d4fd,#b721ff);
    color:#0f0f14;
    font-weight:700;
    text-decoration:none;
    margin-right:15px;
    position:relative;
    overflow:hidden;
}

.btns a::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(120deg,transparent,rgba(255,255,255,0.4),transparent);
    transform:translateX(-100%);
}

.btns a:hover::after{
    transform:translateX(100%);
    transition:0.6s;
}

.btns a:hover{
    transform:translateY(-5px);
    box-shadow:0 12px 30px rgba(33,212,253,0.45);
}

/* IMAGE */
.sub2 img{
    width:280px;
    height:280px;
    border-radius:50%;
    border:6px solid rgba(255,255,255,0.08);
    box-shadow:0 25px 60px rgba(0,0,0,0.6);
}

/* ================= ANIMATIONS ================= */
@keyframes float{
    from{transform:translateY(0);}
    to{transform:translateY(30px);}
}

@keyframes gradientMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* ================= RESPONSIVE ================= */
@media(max-width:768px){
    header{
        padding:15px 30px;
    }

    .navbar ul{
        gap:20px;
    }

    .main{
        flex-direction:column;
        text-align:center;
        gap:50px;
    }

    section{
        padding:70px 30px;
    }

    .sub1 h1{
        font-size:34px;
    }
}

</style>
</head>

            <p>
                I hereby declare that the information and work presented in this portfolio
                are my own and true to the best of my knowledge.
            </p>

            <div class="icons">
                <a href="#"><i class="fa-brands fa-linkedin"></i></a>
                <a href="#"><i class="fa-brands fa-whatsapp"></i></a>
                <a href="https://github.com/mattaparthineeraja06-web" target="_blank">
