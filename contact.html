<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY PORTFOLIO | Contact</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
/* ================= RESET ================= */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, Helvetica, sans-serif;
    scroll-behavior:smooth;
    transition:0.4s;
}

/* ================= BODY ================= */
body{
    background:#0f0f14;
    color:#eaeaea;
    overflow-x:hidden;
}

/* ================= BACKGROUND EFFECT ================= */
body::before,
body::after{
    content:"";
    position:fixed;
    width:320px;
    height:320px;
    border-radius:50%;
    filter:blur(130px);
    z-index:-1;
    animation: float 10s ease-in-out infinite alternate;
}

body::before{
    top:-120px;
    left:-120px;
    background:linear-gradient(135deg,#00f2fe,#4facfe);
}
body::after{
    bottom:-120px;
    right:-120px;
    background:linear-gradient(135deg,#f7971e,#ffd200);
}

/* ================= HEADER ================= */
header{
    position:sticky;
    top:0;
    z-index:999;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 60px;
    background:rgba(20,20,30,0.8);
    backdrop-filter:blur(12px);
    box-shadow:0 8px 25px rgba(0,0,0,0.4);
}

/* LOGO */
.logo h3{
    font-size:22px;
    font-weight:800;
    letter-spacing:2px;
    background:linear-gradient(90deg,#21d4fd,#b721ff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

/* NAVBAR */
.navbar ul{
    list-style:none;
    display:flex;
    gap:45px;
}

.navbar ul li a{
    text-decoration:none;
    color:#eaeaea;
    font-weight:600;
    position:relative;
    padding-bottom:6px;
}

.navbar ul li a::after{
    content:"";
    position:absolute;
    left:0;
    bottom:0;
    width:0%;
    height:2px;
    background:linear-gradient(90deg,#21d4fd,#b721ff);
}

.navbar ul li a:hover::after{
    width:100%;
}

.navbar ul li a:hover,
.navbar a.active{
    color:#21d4fd;
}

/* ================= SECTION ================= */
section{
    max-width:1100px;
    margin:80px auto;
    padding:100px 60px;
    border-radius:22px;
    background:rgba(255,255,255,0.03);
    backdrop-filter:blur(10px);
    box-shadow:0 20px 40px rgba(0,0,0,0.3);
}

/* ================= CONTACT ================= */
.contact-title{
    text-align:center;
    margin-bottom:60px;
}

.contact-title span{
    font-size:14px;
    letter-spacing:2px;
    color:#9ca3af;
}

.contact-title h2{
    font-size:38px;
    margin-top:10px;
    background:linear-gradient(90deg,#21d4fd,#b721ff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

/* LAYOUT */
.contact-container{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:60px;
}

/* INFO */
.contact-info h3{
    font-size:24px;
    margin-bottom:20px;
    background:linear-gradient(90deg,#21d4fd,#b721ff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.contact-info p{
    font-size:16px;
    line-height:1.7;
    color:#cbd5f5;
    margin-bottom:30px;
}

/* ICONS */
.contact-info ul{
    list-style:none;
}

.contact-info ul li{
    margin-bottom:18px;
    font-size:16px;
}

.contact-info ul li i{
    color:#21d4fd;
    margin-right:12px;
}

/* FORM */
.contact-form form{
    display:flex;
    flex-direction:column;
    gap:20px;
}

.contact-form input,
.contact-form textarea{
    padding:14px 18px;
    border-radius:12px;
    border:none;
    outline:none;
    background:rgba(255,255,255,0.08);
    color:#fff;
    font-size:15px;
}

.contact-form textarea{
    resize:none;
    height:150px;
}

.contact-form input::placeholder,
.contact-form textarea::placeholder{
    color:#9ca3af;
}

/* BUTTON */
.contact-form button{
    align-self:flex-start;
    padding:12px 36px;
    border-radius:30px;
    border:none;
    background:linear-gradient(90deg,#21d4fd,#b721ff);
    color:#0f0f14;
    font-weight:700;
    cursor:pointer;
}

.contact-form button:hover{
    transform:translateY(-5px);
    box-shadow:0 12px 30px rgba(33,212,253,0.45);
}

/* ================= RESPONSIVE ================= */
@media(max-width:900px){
    header{padding:18px 30px;}
    section{padding:80px 30px;}
    .contact-container{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo"><h3>NEERAJA</h3></div>
    <div class="navbar">
        <ul>
            <li><a href="home.html">HOME</a></li>
            <li><a href="about.html">ABOUT</a></li>
            <li><a href="skills.html">SKILLS</a></li>
            <li><a href="projects.html">PROJECTS</a></li>
            <li><a class="active" href="contact.html">CONTACT</a></li>
        </ul>
    </div>
</header>

<section id="contact">
    <div class="contact-title">
        <span>Get In Touch</span>
        <h2>Contact Me</h2>
    </div>

    <div class="contact-container">

        <!-- INFO -->
        <div class="contact-info">
            <h3>Let's Talk</h3>
            <p>
                Feel free to reach out to me for collaborations, projects, or any queries.
                I’ll try to get back to you as soon as possible.
            </p>

            <ul>
                <li><i class="fas fa-envelope"></i> neeraja@email.com</li>
                <li><i class="fas fa-phone"></i> +91 98765 43210</li>
                <li><i class="fas fa-location-dot"></i> India</li>
            </ul>
        </div>

        <!-- FORM -->
        <div class="contact-form">
            <form>
                <input type="text" placeholder="Your Name" required>
                <input type="email" placeholder="Your Email" required>
                <textarea placeholder="Your Message" required></textarea>
                <button type="submit">Send Message</button>
            </form>
        </div>

    </div>
</section>

</body>
</html>
